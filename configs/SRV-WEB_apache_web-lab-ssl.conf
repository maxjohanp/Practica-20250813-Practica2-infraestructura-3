# SRV-WEB (web-0813) · /etc/apache2/sites-available/web-lab-ssl.conf
# Único sitio activo: HTTPS en el puerto 443 (000-default y default-ssl desactivados).
# El certificado es autofirmado (CN web.lab.local, SAN IP 10.8.13.10 e IP 20.25.8.13).
# La clave privada web-lab.key se queda en el servidor: no se publica.
<VirtualHost *:443>
    ServerName web.lab.local
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/web-lab.crt
    SSLCertificateKeyFile /etc/ssl/private/web-lab.key
    ErrorLog  ${APACHE_LOG_DIR}/web-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/web-lab-access.log combined
</VirtualHost>
