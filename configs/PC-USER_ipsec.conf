# PC-USER (pc-user20250813) · /etc/ipsec.conf · cliente strongSwan de la VPN de acceso remoto
# Los secretos van en /etc/ipsec.secrets (permisos 600) y NO se publican:
#   @cliente-lab 20.25.8.13 : PSK "<ELIMINADO>"
#   vpnuser : XAUTH "<ELIMINADO>"
config setup
    charondebug="ike 1, knl 1, cfg 0"

conn fgt
    keyexchange=ikev1
    aggressive=yes
    authby=xauthpsk
    xauth=client
    left=%defaultroute
    leftid=@cliente-lab
    leftsourceip=%config
    xauth_identity=vpnuser
    right=20.25.8.13
    rightid=20.25.8.13
    rightsubnet=10.8.13.0/28
    ike=des-sha1-modp1024!
    esp=des-sha1-modp1024!
    ikelifetime=8h
    keylife=1h
    dpdaction=restart
    dpddelay=30s
    auto=add
